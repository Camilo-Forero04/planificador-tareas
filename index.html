<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cami Plans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Righteous&family=Sen:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg bg-pink">
      <div class="container">
        <a class="navbar-brand" href="#">
          <span class="fw-bold display-6 text-white">CAMI PLANS</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-label="Abrir navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Tareas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="#logros">Logros</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5 flex-grow-1">
      <div class="row g-4">
        <!-- formulario y tablero -->
        <div class="col-lg-9">
          <!-- formulario -->
          <section class="mt-4 py-4 px-4 bg-black font-pink rounded-3">
            <h2 class="mb-3">NUEVA TAREA</h2>

            <!-- alerta de campos -->
            <div id="alertaSmart"></div>

            <form id="newTaskForm" novalidate>
              <div class="row g-3">
                <!-- nombre -->
                <div class="col-md-6">
                  <label for="inputObjetivo" class="form-label">
                    ¿Qué esperas <span class="fw-bold">lograr</span>?
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="inputObjetivo"
                    placeholder="Ej: Maquetar el formulario en HTML"
                  />
                </div>

                <!-- fecha -->
                <div class="col-md-6">
                  <label for="inputTiempo" class="form-label">
                    ¿Cuál es el <span class="fw-bold">tiempo límite</span>?
                  </label>
                  <input type="date" class="form-control" id="inputTiempo" />
                </div>

                <!-- descripcion -->
                <div class="col-12">
                  <label for="inputRelevante" class="form-label">
                    Descripción o <span class="fw-bold">primer paso concreto</span>
                  </label>
                  <textarea
                    class="form-control"
                    id="inputRelevante"
                    rows="3"
                    placeholder="Ej: Crear la estructura del formulario y conectar el evento submit..."
                  ></textarea>
                </div>

                <!-- añadir -->
                <div class="col-12 d-flex justify-content-end mt-3">
                  <button
                    type="submit"
                    class="btn btn-primary rounded-5 fw-semibold px-4"
                  >
                    + Agregar Tarea
                  </button>
                </div>
              </div>
            </form>
          </section>

          <!-- tablero-->
          <section id="contenedorObjetivos" class="mt-4 bento-grid">
            <!-- tajetas generadas con JS -->
          </section>
        </div>

        <!-- aside de logros -->
        <aside id="logros" class="col-lg-3">
          <div class="logros-panel bg-brown text-white rounded-3 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 id="tituloLogros" class="h4 mb-0">
                <i class="fa-solid fa-trophy text-white"></i> LOGROS
              </h2>
              <span id="contadorLogros" class="badge bg-black">0</span>
            </div>
            <p id="logrosVacio" class="text-white-50 small mb-0">
              Aún no tienes logros. Cuando completes tus tareas, podrás guardarlas
              aquí.
            </p>
            <ul id="listaLogros" class="list-unstyled d-grid gap-3 mb-0"></ul>
          </div>
        </aside>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/bento.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
