<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cami Plans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Righteous&family=Sen:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg bg-pink">
      <div class="container">
        <a class="navbar-brand" href="#">
          <span class="fw-bold display-6 text-white">CAMI PLANS</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Tareas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Logros</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Inicio página -->
    <main class="container py-5 flex-grow-1">
      <!-- Formulario SMART -->
      <section class="container mt-4 py-5 px-4 bg-black font-pink rounded-3">
        <h2>CREA TU SMART</h2>
        <div id="alertaSmart" class="mt-2"></div>
        <div class="row">
          <!-- Columna 1 -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="inputObjetivo" class="form-label">
                ¿Qué esperas <span class="fw-bold">lograr</span>?
              </label>
              <input
                type="text"
                class="form-control"
                id="inputObjetivo"
                placeholder="Ej: Ser programador Fullstack"
              />
            </div>
            <div class="mb-3">
              <label for="inputMetrica" class="form-label">
                ¿Qué número o <span class="fw-bold">métrica</span> utilizarás?
              </label>
              <input
                type="text"
                class="form-control"
                id="inputMetrica"
                placeholder="Ej: 3 proyectos completados"
              />
            </div>
            <div class="mb-3">
              <label for="inputAlcanzable" class="form-label">
                ¿Es <span class="fw-bold">alcanzable</span> para ti?
              </label>
              <input
                type="text"
                class="form-control"
                id="inputAlcanzable"
                placeholder="Ej: Sí, dedicando 2 horas al día"
              />
            </div>
          </div>

          <!-- Columna 2 -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="inputRelevante" class="form-label">
                ¿Por qué te <span class="fw-bold">importa</span>?
              </label>
              <textarea
                class="form-control"
                id="inputRelevante"
                rows="4"
                placeholder="Justifica tu objetivo... (Mientras más escribas, mayor prioridad tendrá)"
              ></textarea>
              <!-- Termómetro de prioridad -->
              <div class="progress mt-2" style="height: 8px">
                <div
                  id="barraPrioridad"
                  class="progress-bar bg-secondary"
                  role="progressbar"
                  style="width: 15%"
                ></div>
              </div>
              <small id="textoPrioridadDetectada" class="text-white-50">
                Prioridad detectada: Baja (0 caracteres)
              </small>
            </div>

            <div class="mb-1">
              <label for="inputTiempo" class="form-label">
                ¿Cuál es el <span class="fw-bold">tiempo límite</span>?
              </label>
              <input type="date" class="form-control" id="inputTiempo" />
            </div>

            <!-- Botones -->
            <div class="mt-4 d-flex gap-2 flex-wrap">
              <button
                type="button"
                id="btnAbrirModalTarea"
                class="btn btn-primary rounded-5 fw-semibold"
              >
                + Agregar Tarea (<span id="contadorTareas">0</span>)
              </button>
              <button
                type="button"
                id="btnCrearSmart"
                class="btn btn-primary rounded-5 fw-semibold oculto"
              >
                Crear Smart
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Grilla Bento de Objetivos -->
      <section id="contenedorObjetivos" class="container mt-4 bento-grid">
        <!-- Las tarjetas se generan aquí con JS -->
      </section>

      <!-- MODAL 1: Agregar Tarea -->
      <div
        class="modal fade"
        id="modalCrearTarea"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content bg-black font-pink border-light">
            <div class="modal-header border-secondary">
              <h5 class="modal-title">Asignar Tarea al Objetivo</h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <!-- El alertaTarea va aquí adentro, al inicio del body -->
            <div class="modal-body">
              <div id="alertaTarea"></div>

              <div class="mb-3">
                <label class="form-label">Plantilla rápida (Opcional)</label>
                <select id="selectVerbo" class="form-select mb-3">
                  <option value="">-- Elige un verbo para arrancar --</option>
                  <option value="Investigar sobre ">Investigar sobre...</option>
                  <option value="Dedicar 1 hora a ">Dedicar 1 hora a...</option>
                  <option value="Bocetar o estructurar ">
                    Bocetar o estructurar...
                  </option>
                </select>
                <label for="inputDescTarea" class="form-label"
                  >¿Cuál es la tarea?</label
                >
                <input
                  type="text"
                  id="inputDescTarea"
                  class="form-control"
                  placeholder="Ej: Maquetar el formulario en HTML"
                />
              </div>
              <div class="form-check mt-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="checkContrato"
                />
                <label
                  class="form-check-label text-white small"
                  for="checkContrato"
                >
                  Me comprometo a empezar esta tarea en las próximas 48 horas.
                </label>
              </div>
            </div>
            <div class="modal-footer border-secondary">
              <button
                type="button"
                id="btnGuardarTarea"
                class="btn btn-primary rounded-5"
              >
                Guardar Tarea
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- MODAL 2: Visualizar Objetivo y sus Tareas -->
      <div
        class="modal fade"
        id="modalVerSmart"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content bg-black font-pink border-light">
            <div class="modal-header border-secondary">
              <h5 class="modal-title" id="tituloModalVer">
                Detalle del Objetivo
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body text-white" id="cuerpoModalVer"></div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
